<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234669a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121614" />
    <meta name="description" content="SENTINEL — Integrated Situational Awareness & Emergency Response Platform." />
    <link rel="manifest" href="/manifest.json" />
    <title>SENTINEL — Operations Dashboard</title>
    <!-- Prevent theme flash before hydration -->
    <script>
      (function() {
        try {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        } catch(e) {}
      })();
    </script>
    <!-- Fonts: Inter (Clean modern UI) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="sentinel-initial-loader" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #060A09; color: #F0FDF4; font-family: Inter, system-ui, sans-serif;">
        <div style="text-align: center; max-width: 360px; padding: 2rem;">
          <div style="font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.5rem; color: #F0FDF4;">Loading SENTINEL…</div>
          <div style="font-size: 0.8rem; color: #869E96;">Preparing sign in…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
